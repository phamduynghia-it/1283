<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Happy birthday to my love 💖</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- MUSIC TOGGLE -->
        <div id="musicToggle" class="music-btn">🔊</div>

        <audio id="bgMusic" src="music.mp3" loop></audio>
        <canvas id="bg"></canvas>
        <canvas id="hearts"></canvas>
        <!-- CARD THƯ -->
        <div class="card" id="letterCard">
            <h2>Happy birthday to my love</h2>
            <span class="corner-heart left"></span>
            <span class="corner-heart right"></span>
            <!-- chữ gõ trực tiếp trên card -->
            <p id="typing" class="content"></p>

            <div class="heart-btn">
                <span class="center-heart"></span>
            </div>
        </div>

        <!-- SLIDE ẢNH -->
        <div class="card hidden" id="slideCard">
            <h2>Happy birthday to my love</h2>

            <div class="photo">
                <img id="slideImg" src="images/a1.jpg" />
            </div>
            <div class="controls">
                <button onclick="prev()">❮</button>
                <button>❤️</button>
                <button onclick="next()">❯</button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
